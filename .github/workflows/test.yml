name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: |
          VGB_ROUTER_TEST_HOST="$(docker network inspect --format '{{(index .IPAM.Config 0).Gateway}}' bridge)" python -m unittest discover -s tests -p test_router.py -v
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f gateway/Dockerfile -t vpngate-gateway .
      - run: docker run --rm --cap-add=NET_ADMIN --entrypoint python -v "$PWD/gateway/firewall_check.py:/app/firewall_check.py:ro" vpngate-gateway /app/firewall_check.py
  sing-box-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p /tmp/vpngate-bridge-ci && openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/vpngate-bridge-ci/key.pem -out /tmp/vpngate-bridge-ci/cert.pem -subj /CN=localhost -days 1 2>/dev/null
      - run: python -m gateway.bridge_fixture
      - run: docker build -f bridge/Dockerfile -t vpngate-sing-box .
      - run: docker run --rm -v /tmp/vpngate-bridge-ci:/work:ro vpngate-sing-box check -c /work/config.json
