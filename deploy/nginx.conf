server {
    listen 80;
    server_name bridge.example.com;
    access_log off;
    error_log /dev/null;
    return 308 https://bridge.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name bridge.example.com;
    ssl_certificate /etc/vpngate-bridge/tls/fullchain.pem;
    ssl_certificate_key /etc/vpngate-bridge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;

    location /sub/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
